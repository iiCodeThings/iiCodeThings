[program:chat-api]
directory=/opt/iicode-chat/backend
command=/opt/iicode-chat/backend/.venv/bin/uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/iicode-chat/api.out.log
stderr_logfile=/var/log/iicode-chat/api.err.log
environment=APP_USERNAME="admin",APP_PASSWORD="change-me",SESSION_SECRET="replace-me",PYTHONPATH="/opt/iicode-chat/backend"
